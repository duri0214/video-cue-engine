[package]
name = "video-cue-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Detect motion intervals in fixed-camera MP4 recordings"
default-run = "video-cue-engine"

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "dep:dirs", "dep:windows-sys"]

[[bin]]
name = "video-cue-engine-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.15", optional = true }

[target.'cfg(not(windows))'.dependencies]
dirs = { version = "6", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = ["Win32_UI_Shell", "Win32_System_Com"] }
